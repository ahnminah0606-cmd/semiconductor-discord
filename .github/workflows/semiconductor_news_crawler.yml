# 반도체 뉴스 크롤러 자동화 워크플로우
# 매일 오전 7:17 KST 실행, 8:37 KST에 누락 대비 백업 실행

name: 반도체 뉴스 자동 크롤러

on:
  schedule:
    - cron: "17 22 * * *"  # 매일 오전 7:17 KST
    - cron: "37 23 * * *"  # 매일 오전 8:37 KST 백업
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "디버그 모드 활성화"
        type: boolean
        default: false

concurrency:
  group: "news-crawler"
  cancel-in-progress: false

jobs:
  crawl-and-notify:
    name: 크롤링 및 Discord 알림
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Python 3.11 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "라이브러리 설치 완료"

      - name: Playwright Chromium 설치
        run: |
          playwright install --with-deps chromium

      - name: 뉴스 크롤러 실행
        id: crawler
        env:
          DISCORD_WEBHOOK_NAVER: ${{ secrets.DISCORD_WEBHOOK_NAVER }}
          DISCORD_WEBHOOK_TRENDFORCE: ${{ secrets.DISCORD_WEBHOOK_TRENDFORCE }}
          DISCORD_WEBHOOK_SEMIANALYSIS: ${{ secrets.DISCORD_WEBHOOK_SEMIANALYSIS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: |
          python semiconductor_news_crawler.py

      - name: 실행 결과 확인
        run: |
          echo "=== 크롤링 결과 요약 ==="

          if [ -d "data" ]; then
            ls -la data/

            latest_file=$(ls -t data/*.json 2>/dev/null | head -1)

            if [ -n "$latest_file" ]; then
              python3 - <<PY
          import json

          with open("$latest_file", encoding="utf-8") as f:
              data = json.load(f)

          naver = data.get("naver", [])
          trendforce = data.get("trendforce", [])
          semianalysis = data.get("semianalysis", [])

          print(f"NaverNews: {len(naver)}건")
          print(f"TrendForce: {len(trendforce)}건")
          print(f"SemiAnalysis: {len(semianalysis)}건")

          total = len(naver) + len(trendforce) + len(semianalysis)
          print(f"총 {total}건 수집")

          print("\n=== NaverNews ===")
          for i, item in enumerate(naver[:3], 1):
              print(f"{i}. {item['title'][:60]}")

          print("\n=== TrendForce ===")
          for i, item in enumerate(trendforce[:3], 1):
              print(f"{i}. {item['title'][:60]}")

          print("\n=== SemiAnalysis ===")
          for i, item in enumerate(semianalysis[:3], 1):
              print(f"{i}. {item['title'][:60]}")
          PY
            else
              echo "JSON 결과 파일이 없습니다."
            fi
          else
            echo "data 디렉토리가 없습니다."
          fi

      - name: 결과 자동 커밋
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions Bot"

          # 중복 방지 상태와 결과만 커밋하고, 비밀값 노출 위험이 있는 로그는 제외
          git add -f data/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "커밋할 변경사항 없음"
          else
            TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
            git commit -m "자동 크롤링: ${TIMESTAMP}"
            git push
            echo "결과 커밋 완료"
          fi

      - name: 실패 시 Issue 자동 생성
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const now = new Date().toLocaleString('ko-KR', {
              timeZone: 'Asia/Seoul'
            });

            const runUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[자동] 크롤러 실행 실패 - ${now}`,
              body: `## 크롤러 실행 실패 알림

            **실행 시간**: ${now}
            **워크플로우 링크**: [Actions 로그 확인](${runUrl})

            ### 확인 사항
            - Discord Webhook URL 유효성 확인
            - TrendForce Webhook 설정 확인
            - SemiAnalysis Webhook 설정 확인
            - 크롤링 대상 사이트 구조 변경 여부
            - Playwright 의존성 설치 오류 여부

            이 이슈는 GitHub Actions에 의해 자동 생성되었습니다.`
            });
